<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#000;--card:#1c1c1e;--top:#2b2b2d;--tx:#e8e8ea;--mute:#9a9a9f;--ac:#0a95ff;--line:#2a2a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Roboto,system-ui,sans-serif}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px}

main{padding:6px 14px calc(env(safe-area-inset-bottom) + 28px)}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lc{background:var(--card);border-radius:14px;min-height:112px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:inherit;text-decoration:none}
.lc .r{display:flex;justify-content:space-between;color:var(--mute)}
.lc b{font-size:17px;font-weight:600;line-height:1.2}
.bar{display:flex;gap:8px;align-items:center;padding:2px 0 12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:16px;padding:6px 13px;font:inherit;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bar select{margin-left:auto;background:var(--card);color:var(--tx);border:0;border-radius:8px;padding:7px 8px;font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.it{color:inherit;text-decoration:none;min-width:0}
.po{aspect-ratio:2/3;border-radius:8px;background:linear-gradient(160deg,#34343a,#17171a);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;padding:8px;color:var(--mute);font-size:14px}

.it .t{margin-top:6px;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.ok{width:15px;height:15px;border-radius:50%;background:var(--ac);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ok svg{width:10px;height:10px;stroke:#fff;stroke-width:3.5}
.hero{background:var(--top);margin:0 -14px;padding:calc(env(safe-area-inset-top) + 64px) 0 22px;display:flex;justify-content:center}
.hero .po{width:62%;max-width:300px;box-shadow:0 2px 10px #0008}
.back{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;z-index:6;background:#000a}
h2{font-size:32px;line-height:1.15;margin:22px 0 14px}
.ov{font-size:18px;line-height:1.45;margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ov.full{display:block}
.more{background:none;border:0;color:var(--ac);font:inherit;float:right;padding:4px 0}
.meta{display:flex;margin:18px 0;border-block:1px solid var(--line);overflow-x:auto;clear:both}

.meta div:first-child{border:0}
.meta small{display:block;color:var(--mute);font-weight:600;font-size:13px;margin-bottom:6px}
.meta span{font-size:17px;font-weight:600;display:block}
.sec h3{font-size:21px;margin:22px 0 6px}
.sec p{margin:0;color:var(--mute);font-size:17px;white-space:pre-wrap;word-break:break-word}
.pgh{display:flex;align-items:center;gap:9px;width:100%;background:var(--card);border:0;color:var(--tx);font:inherit;font-weight:600;padding:13px 14px;border-radius:12px;text-align:left;margin-top:6px}
.pgh small{color:var(--mute);font-weight:400}.pgh .c{margin-left:auto;color:var(--mute)}.dot{width:11px;height:11px;border-radius:50%;flex:none}
#pgb ol{padding-left:24px;margin:12px 0;color:var(--mute);font-size:16px;line-height:1.45}#pgb li{margin-bottom:10px}#pgb .spo li{color:#ff9f0a}

.cb.on svg{fill:#ff5a76;stroke:#ff5a76}
.hr{display:grid;grid-template-columns:136px 1fr;gap:18px;margin-top:20px}
.vp{position:relative;width:136px;height:204px;box-shadow:0 10px 26px rgba(0,0,0,.55);border-radius:14px}.vp .po{width:100%;height:100%;aspect-ratio:auto;border-radius:14px;border:1px solid rgba(255,255,255,.14);padding:0;font-size:0}
.rb{position:absolute;top:8px;left:8px;background:rgba(11,11,12,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--gd);border-radius:12px;padding:5px 9px;color:#F4F1EA;text-decoration:none;display:block}
.rr{display:flex;align-items:center;gap:5px}.rr b{font:700 18px/1.1 'Playfair Display',Georgia,serif}
.stx{width:13px;height:13px}.rb small{display:block;font-size:10.5px;color:#D6D3CB;white-space:nowrap}
.hi{min-width:0}.hi i{font-style:normal;color:var(--gd);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.hi h2{margin:6px 0 4px;font:700 30px/1.08 'Playfair Display',Georgia,serif;word-break:break-word}
.mt{color:var(--mu2);font-size:14px}
.bg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.bg span{background:rgba(255,255,255,.09);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:700}.bg span.o{background:none;border:1px solid rgba(244,241,234,.55)}
.cl{display:block;color:var(--mu2);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}.cn{font-size:15px;font-weight:600;margin-top:4px}
.gp{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.gp span{border:1px solid var(--gd);color:var(--gd);border-radius:999px;padding:7px 16px;font-size:14px}
.ws{display:flex;align-items:center;justify-content:space-between;border-block:1px solid var(--hl);padding:12px 0;min-height:68px}
.ws small{display:block;color:var(--mu2);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.ws b{display:block;font-size:18px;margin:3px 0}.ws b .gd{color:var(--gd);padding:0 3px}.ws em{font-style:normal;color:var(--mu2);font-size:13px}
.ws .wg{color:var(--gr);font-size:16px}.ws .mu{color:var(--mu2)}
.tkb{width:44px;height:44px;display:grid;place-items:center;flex:none}.tk{width:36px;height:36px;display:block}
.dv h3{color:var(--gd);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px}
.sc2,.dv .sec{margin-top:14px}.dv .sec h3{font-size:10.5px;margin:0 0 4px}
.sy{margin:0;font-size:16px;line-height:1.75;text-align:justify;color:#D6D3CB}
.dc{float:left;font:700 54px/.85 'Playfair Display',Georgia,serif;color:var(--gd);padding:8px 8px 0 0}
.mo{background:none;border:0;color:var(--gd);font:inherit;font-weight:700;padding:0}
.il{display:flex;flex-wrap:wrap;gap:10px}.il span{display:inline-flex;align-items:center;gap:9px;background:var(--cd);border:1px solid var(--hl);border-radius:999px;padding:10px 15px;font-size:15px}.il svg{width:16px;height:16px;color:var(--gd)}
.dhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.dhd h3{margin:0}
.sz{background:rgba(143,211,164,.14);color:var(--gr);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700}
.dc2{display:flex;gap:12px;align-items:flex-start;background:var(--cd);border:1px solid rgba(143,211,164,.45);border-radius:14px;padding:14px;margin-bottom:10px;font:12px/1.6 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:#D6D3CB}
.dc2 svg{width:20px;height:20px;flex:none;color:var(--gr)}.dc2 em{font-style:normal;color:var(--gr)}
.of{margin:0;color:var(--mu2);font-size:14px;white-space:pre-wrap;word-break:break-all}
.empty{color:var(--mute);text-align:center;padding:48px 12px}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const I={film:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M16 3v18M4 8h4M4 12h4M4 16h4M16 8h4M16 12h4M16 16h4"/>',tv:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',back:'<path d="M19 12H5M12 5l-7 7 7 7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',ok:'<path d="M5 12l5 5 9-10"/>',mark:'<path d="M6 3h12v18l-6-4-6 4z"/>',drive:'<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13l2.5-8h9L19 13M7 16.5h.01M11 16.5h5"/>',heart:'<path d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5c0 6.1-8 11-8 11z"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const DEMO={updated:Date.now(),lists:[{id:'m',name:'The Movie Vault',kind:'movie',items:['a','b']},{id:'t',name:'The TV Vault',kind:'tv',items:['c']}],titles:{a:{title:'All Quiet on the Western Front',year:2022,rating:7.7,kind:'movie',overview:'Demo data. Open Settings and add your snapshot link to see your own lists.',director:'Edward Berger',on:'Netflix',added:Date.now()-4e10,watched:false},b:{title:'1917',year:2019,rating:8.2,kind:'movie',overview:'Demo title.',added:Date.now()-4e10,watched:true},c:{title:'Arrested Development',year:2003,rating:8.7,kind:'tv',overview:'Demo show.',added:Date.now()-1e10,watched:true}}};
let D=LS('snap'),demo=!D;D=D||DEMO;
const ago=ms=>{if(!ms)return'';const d=(Date.now()-ms)/864e5;if(d<1)return'today';if(d<30)return Math.floor(d)+(d<2?' day':' days')+' ago';if(d<365){const m=Math.floor(d/30);return m+(m<2?' month':' months')+' ago'}const y=Math.floor(d/365);return y+(y<2?' year':' years')+' ago'};
const poster=t=>`<div class="po">${t.poster?`<img loading="lazy" src="${esc(t.poster)}" alt="">`:esc(t.title)}</div>`;
const card=(id,t)=>`<a class="it" href="#/title/${encodeURIComponent(id)}">${poster(t)}<div class="t">${esc(t.title)}</div><div class="a">${t.watched?`<span class="ok">${ic('ok')}</span>`:''}${esc(t.watched&&t.wat?'Watched '+ago(t.wat):(t.year||''))}</div></a>`;
let q='',flt='all',srt='list',showQ=false;
function home(){const L=D.lists||[];app.innerHTML=`<header><h1>Vault</h1><button class="ib" id="s">${ic('search')}</button><button class="ib" id="g">${ic('gear')}</button></header><main>${demo?'<p class="msg">Showing demo data. Add your snapshot link in Settings.</p>':''}<div class="lists">${L.map(l=>`<a class="lc" href="#/list/${encodeURIComponent(l.id)}"><div class="r">${ic(l.kind==='tv'?'tv':'film')}<span>${l.items.length}</span></div><b>${esc(l.name)}</b></a>`).join('')}</div></main>`;$('#s').onclick=()=>{q='';location.hash='#/search'};$('#g').onclick=()=>location.hash='#/settings'}
function listing(title,ids,back,searchable,kindFor){
 let rows=ids.map(i=>[i,D.titles[i]]).filter(x=>x[1]);
 const t=q.trim().toLowerCase();if(t)rows=rows.filter(x=>x[1].title.toLowerCase().includes(t));
 if(flt==='un')rows=rows.filter(x=>!x[1].watched);if(flt==='w')rows=rows.filter(x=>x[1].watched);if(flt==='f'){const fv=LS('fav')||{};rows=rows.filter(x=>fv[x[0]])}
 const k={title:(a,b)=>a[1].title.localeCompare(b[1].title),added:(a,b)=>(b[1].wat||0)-(a[1].wat||0),rating:(a,b)=>(b[1].rating||0)-(a[1].rating||0),year:(a,b)=>(b[1].year||0)-(a[1].year||0)}[srt];if(k)rows.sort(k);
 app.innerHTML=`<header><button class="ib" id="b">${ic('back')}</button>${showQ?`<input id="q" placeholder="Search" value="${esc(q)}">`:`<h1>${esc(title)}</h1>`}<button class="ib" id="s">${ic('search')}</button></header><main>${back==='list'?`<div class="bar">${[['all','All'],['un','Unwatched'],['w','Watched'],['f','Favorites']].map(c=>`<button class="chip ${flt===c[0]?'on':''}" data-f="${c[0]}">${c[1]}</button>`).join('')}<select id="o">${[['list','List order'],['title','Title'],['added','Recently watched'],['rating','Rating'],['year','Year']].map(o=>`<option value="${o[0]}" ${srt===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`:''}${rows.length?`<div class="grid">${rows.map(r=>card(r[0],r[1])).join('')}</div>`:'<div class="empty">Nothing here.</div>'}</main>`;
 $('#b').onclick=()=>history.length>1?history.back():location.hash='#/';
 $('#s').onclick=()=>{showQ=!showQ;if(!showQ)q='';route(true)};
 const qi=$('#q');if(qi){qi.focus();qi.setSelectionRange(99,99);qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;route(true);const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;route(true)});
 const o=$('#o');if(o)o.onchange=()=>{srt=o.value;route(true)};}
const pgHtml=t=>{const p=t.pg;if(!p)return'';const sv=String(p.sev||''),c=/sever/i.test(sv)?'#ff453a':/moder/i.test(sv)?'#ff9f0a':/mild/i.test(sv)?'#ffd60a':/none/i.test(sv)?'#30d158':'#6b6b70',it=p.items||[],ns=it.filter(i=>!i[1]),sp=it.filter(i=>i[1]);
return `<div class="sec"><h3>Parental guide</h3><button class="pgh" id="pgt"><span class="dot" style="background:${c}"></span>${esc(sv||'Not listed')}${p.votes?`<small>${esc(p.votes)} votes</small>`:''}<span class="c" id="pgc">▸</span></button><div id="pgb" hidden><ol>${ns.map(i=>`<li>${esc(i[0])}</li>`).join('')||'<li>No written entries.</li>'}</ol>${sp.length?`<button class="chip" id="pgs">Show spoilers (${sp.length})</button><ol class="spo" id="pgsp" hidden>${sp.map(i=>`<li>${esc(i[0])}</li>`).join('')}</ol>`:''}</div></div>`};
const FV=()=>LS('fav')||{},nf=n=>Number(n).toLocaleString('en-US'),p2=n=>String(n).padStart(2,'0');
const SL={ended:'Ended',ongoing:'Ongoing',canceled:'Canceled',upcoming:'Upcoming'};
const TKF='<svg viewBox="0 0 36 36" class="tk"><circle cx="18" cy="18" r="18" fill="#ed1c24"/><circle cx="18" cy="18" r="9" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M13.5 18.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const tkb=t=>{const im=`<img class="tk" src="trakt.svg" alt="" onerror="this.outerHTML=TKF">`;return t.imdb?`<a class="tkb" href="https://trakt.tv/search/imdb/${esc(t.imdb)}" target="_blank" rel="noopener" aria-label="Open on Trakt">${im}</a>`:`<span class="tkb" role="img" aria-label="Watched on Trakt">${im}</span>`};
const STI='<svg viewBox="0 0 24 24" class="stx"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.8 7.4L12 18l-6.6 4 1.8-7.4-5.7-5 7.5-.7z" fill="#f5b83d" stroke="none"/></svg>';
function tint(el,u,seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))%360;el.style.setProperty('--tn',`hsla(${h},45%,28%,.6)`);if(!u)return;const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{if(!el.isConnected)return;const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(im,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){const w=1+(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]))/32;r+=d[i]*w;g+=d[i+1]*w;b+=d[i+2]*w;n+=w}el.style.setProperty('--tn',`rgba(${r/n*.75|0},${g/n*.75|0},${b/n*.75|0},.65)`)}catch(e){}};im.src=u}
function detail(id){const t=D.titles[id];if(!t)return location.hash='#/';
 const X={};(t.extra||[]).forEach(e=>{if(e&&e[1])X[e[0]]=e[1]});const tv=t.kind==='tv',yr=new Date().getFullYear();
 const rt=t.rtl||X.Runtime||'',st=tv?(SL[t.tst]||''):(t.year>yr?'Upcoming':'Released');

 const r=Number(t.rating)||0,rb=r?`<${t.imdb?`a href="https://www.imdb.com/title/${esc(t.imdb)}/" target="_blank" rel="noopener"`:'div'} class="rb"><div class="rr">${STI}<b>${r.toFixed(1)}</b></div>${t.votes?`<small>${nf(t.votes)} votes</small>`:''}</${t.imdb?'a':'div'}>`:'';
 const tkOn=t.tk!==undefined?!!t.tk:!!t.watched,wl=t.watched?'Watched'+(t.wat?' '+ago(t.wat):''):'';
 const cnt=[tv&&t.sn?t.sn+(t.sn===1?' season':' seasons'):'',tv&&(t.ep||X.Episodes)?(t.ep||X.Episodes)+' episodes':''].filter(Boolean).join(' · ');
 let ws;
 if(tv&&t.wu&&t.wu[0])ws=`<div><small>${t.tk==='w'?'Finished':'Watched up to'}</small><b>S${p2(t.wu[0])}<span class="gd">·</span>E${p2(t.wu[1])}</b><em>${esc(cnt)}</em></div>`;

 const rest=(t.extra||[]).filter(e=>e&&e[1]&&e[0]==='Offline copies').map(e=>`<div class="sc2"><h3>${esc(e[0])}</h3><p class="of">${esc(e[1])}</p></div>`).join('');
 app.innerHTML=`<div class="dv"><div class="tb"><button class="cb" id="b" aria-label="Back">${ic('back')}</button><button class="cb ${FV()[id]?'on':''}" id="hv" aria-label="Favourite" aria-pressed="${!!FV()[id]}">${ic('heart')}</button></div><div class="hr"><div class="vp">${poster(t)}${rb}</div><div class="hi"><i>${tv?'TV Series':'Film'}</i><h2>${esc(t.title)}</h2><div class="mt">${esc(meta)}</div>${bd?`<div class="bg">${bd}</div>`:''}${t.director?`<small class="cl">${tv?'Created by':'Directed by'}</small><div class="cn">${esc(t.director)}</div>`:''}</div></div>${chips?`<div class="gp">${chips}</div>`:''}<div class="ws">${ws}${tkOn?tkb(t):''}</div>${sy}${pgHtml(t)}${il}${dk}${rest}</div>`;

function settings(){const s=LS('cfg')||{};app.innerHTML=`<header><button class="ib" id="b">${ic('back')}</button><h1>Settings</h1></header><main><div class="f"><label>Snapshot file (leave empty to use snapshot.enc in this repo)</label><input id="u" value="${esc(s.url||'')}" placeholder="snapshot.enc"><label>Passphrase (the one set in the laptop script)</label><input id="pw" type="password" value="${esc(s.pw||'')}"><button class="btn" id="sv">Save and sync</button><button class="btn g" id="dm">Use demo data</button><div class="msg" id="st">${demo?'Demo data':'Last synced '+esc(ago(D.updated))}</div></div></main>`;

function route(keep){const h=decodeURIComponent(location.hash.slice(1))||'/',p=h.split('/');window.scrollTo(0,keep?scrollY:0);

 else if(p[1]==='title')detail(p.slice(2).join('/'));else if(p[1]==='search'){showQ=true;listing('Search',Object.keys(D.titles||{}),'search')}else if(p[1]==='settings')settings();else home()}
function url(s){const m=s.url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]+)/);return m?`https://www.googleapis.com/drive/v3/files/${m[1]}?alt=media&key=${encodeURIComponent(s.key||'')}`:s.url}
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unseal(j,pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(j.s),iterations:j.it||200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);let raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(j.i)},key,ub(j.d)));if(j.c)raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());return JSON.parse(new TextDecoder().decode(raw))}
const cfgOK=()=>{const s=LS('cfg')||{};return !!(s.url||s.pw)};
async function sync(){const s=LS('cfg');if(!s||!(s.url||s.pw))return'Enter the passphrase first.';try{const u=url({url:s.url||'snapshot.enc',key:s.key});const r=await fetch(u+(/alt=media/.test(u)?'':(u.includes('?')?'&':'?')+'_='+Date.now()),{cache:'no-store'});if(r.status===404)return'No snapshot uploaded yet. Run Phone sync on the laptop first.';if(!r.ok)return'Could not load the file (HTTP '+r.status+').';let j=await r.json();if(j.d&&j.s&&j.i){if(!s.pw)return'This snapshot is encrypted. Enter the passphrase.';try{j=await unseal(j,s.pw)}catch(e){return'Wrong passphrase, or the file is damaged.'}}if(!j.lists||!j.titles)return'This file is not a Vault snapshot.';LS('snap',j);D=j;demo=false;return true}catch(e){return'Could not reach the link. Check it is shared publicly.'}}
