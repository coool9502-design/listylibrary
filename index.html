<style>

<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const I={film:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M16 3v18M4 8h4M4 12h4M4 16h4M16 8h4M16 12h4M16 16h4"/>',tv:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',back:'<path d="M19 12H5M12 5l-7 7 7 7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',ok:'<path d="M5 12l5 5 9-10"/>',mark:'<path d="M6 3h12v18l-6-4-6 4z"/>',drive:'<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13l2.5-8h9L19 13M7 16.5h.01M11 16.5h5"/>',heart:'<path d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5c0 6.1-8 11-8 11z"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const DEMO={updated:Date.now(),lists:[{id:'m',name:'The Movie Vault',kind:'movie',items:['a','b']},{id:'t',name:'The TV Vault',kind:'tv',items:['c']}],titles:{a:{title:'All Quiet on the Western Front',year:2022,rating:7.7,kind:'movie',overview:'Demo data. Open Settings and add your snapshot link to see your own lists.',director:'Edward Berger',on:'Netflix',added:Date.now()-4e10,watched:false},b:{title:'1917',year:2019,rating:8.2,kind:'movie',overview:'Demo title.',added:Date.now()-4e10,watched:true},c:{title:'Arrested Development',year:2003,rating:8.7,kind:'tv',overview:'Demo show.',added:Date.now()-1e10,watched:true}}};
let S=LS('snap'),D,demo=!S;D=S?mk(S):DEMO;
const ago=ms=>{if(!ms)return'';const d=(Date.now()-ms)/864e5;if(d<1)return'today';if(d<30)return Math.floor(d)+(d<2?' day':' days')+' ago';if(d<365){const m=Math.floor(d/30);return m+(m<2?' month':' months')+' ago'}const y=Math.floor(d/365);return y+(y<2?' year':' years')+' ago'};
const poster=t=>`<div class="po">${t.poster?`<img loading="lazy" src="${esc(t.poster)}" alt="">`:esc(t.title)}</div>`;
const card=(id,t)=>`<a class="it" href="#/title/${encodeURIComponent(id)}">${poster(t)}<div class="t">${esc(t.title)}</div><div class="a">${t.watched?`<span class="ok">${ic('ok')}</span>`:''}${esc(t.watched&&t.wat?'Watched '+ago(t.wat):(t.year||''))}</div></a>`;
let q='',flt='all',srt='list',showQ=false,edm=false,CL=null;
function home(){const L=D.lists||[];app.innerHTML=`<header><h1>Vault</h1><button class="ib" id="s">${ic('search')}</button>${demo?'':`<button class="ib" id="nl" aria-label="New list">${ic('plus')}</button>`}<button class="ib" id="g">${ic('gear')}</button></header><main>${demo?'<p class="msg">Showing demo data. Add your snapshot link in Settings.</p>':''}<div class="lists">${L.map(l=>`<a class="lc" href="#/list/${encodeURIComponent(l.id)}"><div class="r">${ic(l.kind==='tv'?'tv':'film')}<span class="n">${l.w?`<span class="ok">${ic('ok')}</span>`:''}${l.items.length}</span></div><b>${esc(l.name)}</b></a>`).join('')}</div></main>`;$('#s').onclick=()=>{q='';location.hash='#/search'};$('#g').onclick=()=>location.hash='#/settings';const nl=$('#nl');if(nl)nl.onclick=newList}
function listing(title,ids,back,searchable,kindFor){
 let rows=ids.map(i=>[i,D.titles[i]]).filter(x=>x[1]);
 const t=q.trim().toLowerCase();if(t)rows=rows.filter(x=>x[1].title.toLowerCase().includes(t));
 if(flt==='un')rows=rows.filter(x=>!x[1].watched);if(flt==='w')rows=rows.filter(x=>x[1].watched);if(flt==='f'){const fv=LS('fav')||{};rows=rows.filter(x=>fv[x[0]])}
 const k={title:(a,b)=>a[1].title.localeCompare(b[1].title),added:(a,b)=>(b[1].wat||0)-(a[1].wat||0),rating:(a,b)=>(b[1].rating||0)-(a[1].rating||0),year:(a,b)=>(b[1].year||0)-(a[1].year||0)}[srt];if(k)rows.sort(k);
 app.innerHTML=`<header><button class="ib" id="b">${ic('back')}</button>${showQ?`<input id="q" placeholder="Search" value="${esc(q)}">`:`<h1>${esc(title)}</h1>`}<button class="ib" id="s">${ic('search')}</button>${back==='list'&&CL&&!demo?`<button class="ib" id="ad" aria-label="Add title">${ic('plus')}</button><button class="ib${edm?' on':''}" id="ed" aria-label="Edit list">${ic('edit')}</button><button class="ib" id="lo" aria-label="List options">${ic('more')}</button>`:''}</header><main>${back==='list'?`<div class="bar">${[['all','All'],['un','Unwatched'],['w','Watched'],['f','Favorites']].map(c=>`<button class="chip ${flt===c[0]?'on':''}" data-f="${c[0]}">${c[1]}</button>`).join('')}<select id="o">${[['list','List order'],['title','Title'],['added','Recently watched'],['rating','Rating'],['year','Year']].map(o=>`<option value="${o[0]}" ${srt===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`:''}${rows.length?`<div class="grid">${rows.map(r=>edm&&back==='list'&&ELIG.test(r[0])?ecard(r[0],r[1]):card(r[0],r[1])).join('')}</div>`:'<div class="empty">Nothing here.</div>'}</main>`;
 $('#b').onclick=()=>history.length>1?history.back():location.hash='#/';
 $('#s').onclick=()=>{showQ=!showQ;if(!showQ)q='';route(true)};
 const ad=$('#ad');if(ad)ad.onclick=openAdd;const ed=$('#ed');if(ed)ed.onclick=()=>{edm=!edm;route(true)};const lo=$('#lo');if(lo)lo.onclick=listOpts;
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>removeItem(b.dataset.rm));
 const qi=$('#q');if(qi){qi.focus();qi.setSelectionRange(99,99);qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;route(true);const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;route(true)});
 const o=$('#o');if(o)o.onchange=()=>{srt=o.value;route(true)};}

  ov.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const l=D.lists.find(x=>x.id===b.dataset.l);if(!l)return;const has=l.items.includes(id);if(doEdit(has?'del':'add',l,id,has?null:itemOf(id)))draw()})};
 draw()}
// ---- list-level edits: create / rename / delete a list, mark it watched or unwatched (same phone-edits.enc path, applied by the laptop on Resync) ----
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==='x'?r:(r&3|8)).toString(16)});
const nameTaken=(n,id)=>(D.lists||[]).some(l=>l.id!==id&&l.name.toLowerCase()===n.toLowerCase());
function doList(o,x){if(!ghOK()){toast('Add the GitHub repo and token in Settings first.');return false}
 const op=Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),o,t:Date.now()},x);
 applyOp(D,op);const P=LS('ops')||[];P.push(op);LS('ops',P);flush(true);return true}
function newList(){let kind='movie',w=0;const ov=document.createElement('div');ov.className='sh';document.body.appendChild(ov);const close=()=>ov.remove();
 const draw=()=>{const e=ov.querySelector('#nn'),v=e?e.value:'';
  ov.innerHTML=`<div class="sb"></div><div class="sp"><h4>New list</h4><div class="f"><input id="nn" placeholder="List name" maxlength="100" autocomplete="off" value="${esc(v)}"></div><div class="bar">${[['movie','Movies'],['tv','TV shows']].map(c=>`<button class="chip ${kind===c[0]?'on':''}" data-k="${c[0]}">${c[1]}</button>`).join('')}</div><div class="bar">${[[0,'Unwatched'],[1,'Watched']].map(c=>`<button class="chip ${w===c[0]?'on':''}" data-w="${c[0]}">${c[1]}</button>`).join('')}</div><button class="btn" id="nc">Create list</button></div>`;
  ov.querySelector('.sb').onclick=close;
  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;draw()});ov.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{w=+b.dataset.w;draw()});
  ov.querySelector('#nc').onclick=()=>{const n=ov.querySelector('#nn').value.replace(/\s+/g,' ').trim();if(!n){toast('Give the list a name.');return}if(nameTaken(n)){toast('A list with that name already exists.');return}
   const id=uuid();if(doList('newlist',{list:id,name:n,kind,w})){close();location.hash='#/list/'+encodeURIComponent(id)}};
  const i=ov.querySelector('#nn');if(i&&!v)i.focus()};
 draw()}
function listOpts(){const L0=CL;if(!L0)return;let mode='';const ov=document.createElement('div');ov.className='sh';document.body.appendChild(ov);const close=()=>ov.remove();
 const draw=()=>{const l=D.lists.find(x=>x.id===L0.id);if(!l){close();return}let b;
  if(mode==='r')b=`<h4>Rename list</h4><div class="f"><input id="rn" maxlength="100" autocomplete="off" value="${esc(l.name)}"></div><button class="btn" id="rs">Save name</button><button class="btn g" id="rc">Cancel</button>`;
  else if(mode==='d')b=`<h4>Delete “${esc(l.name)}”?</h4><p class="msg">The list is removed from the library on the laptop's next Resync. Its ${l.items.length} title${l.items.length===1?'':'s'} stay in any other list they are in. This can't be undone from the phone.</p><button class="btn dl" id="dy">Delete list</button><button class="btn g" id="rc">Cancel</button>`;
  else b=`<h4>${esc(l.name)}</h4><button class="lr" data-a="r">${ic('edit')}<span>Rename</span></button><button class="lr" data-a="w">${ic('ok')}<span>${l.w?'Mark as unwatched':'Mark as watched'}</span></button><button class="lr dg" data-a="d">${ic('trash')}<span>Delete list</span></button><button class="btn g" id="rc">Close</button>`;
  ov.innerHTML=`<div class="sb"></div><div class="sp">${b}</div>`;ov.querySelector('.sb').onclick=close;
  const rc=ov.querySelector('#rc');if(rc)rc.onclick=()=>{if(mode){mode='';draw()}else close()};
  ov.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{const a=x.dataset.a;if(a==='w'){if(doList('status',{list:l.id,v:l.w?'unwatched':'watched'})){close();route(true)}}else{mode=a;draw();const r=ov.querySelector('#rn');if(r){r.focus();r.select()}}});
  const rs=ov.querySelector('#rs');if(rs)rs.onclick=()=>{const n=ov.querySelector('#rn').value.replace(/\s+/g,' ').trim();if(!n){toast('Give the list a name.');return}if(n===l.name){close();return}if(nameTaken(n,l.id)){toast('A list with that name already exists.');return}if(doList('rename',{list:l.id,name:n})){close();route(true)}};
  const dy=ov.querySelector('#dy');if(dy)dy.onclick=()=>{if(doList('dellist',{list:l.id})){close();location.hash='#/'}}};
 draw()}
function tmRow(x){const tv=x.media_type==='tv',d=(tv?x.first_air_date:x.release_date)||'',ti=(tv?x.name:x.title)||'',y=+d.slice(0,4)||0,cv=x.poster_path?'https://image.tmdb.org/t/p/w342'+x.poster_path:'';
 return{key:(tv?'tv:':'movie:')+x.id,kind:tv?'tv':'movie',title:ti,year:y,cover:cv,item:{title:ti,year:y||'',rating:x.vote_average?x.vote_average.toFixed(1):'',genre:(x.genre_ids||[]).map(g=>GN[g]).filter(Boolean).slice(0,3).join(', '),overview:x.overview||'',cover:cv}}}
function openAdd(){const L0=CL;if(!L0)return;const ov=document.createElement('div');ov.className='ao';
 ov.innerHTML=`<header><button class="ib" id="ax" aria-label="Close">${ic('x')}</button><input id="aq" placeholder="Add to ${esc(L0.name)}" autocomplete="off"></header><main id="ar"><div class="empty">Type a title to search TMDB.</div></main>`;document.body.appendChild(ov);
 const inp=ov.querySelector('#aq'),res=ov.querySelector('#ar');let tm=0,seq=0,rows=[];
 const close=()=>{ov.remove();route(true)};ov.querySelector('#ax').onclick=close;
 const draw=()=>{const l=D.lists.find(x=>x.id===L0.id)||L0;res.innerHTML=rows.length?rows.map((r,i)=>`<div class="ar"><div class="at">${r.cover?`<img src="${esc(r.cover.replace('/w342/','/w92/'))}" alt="">`:''}</div><div class="ai"><b>${esc(r.title)}</b><small>${r.year||'—'} · ${r.kind==='tv'?'TV':'Film'}</small></div>${l.items.includes(r.key)?'<span class="ad">Added</span>':`<button class="chip on" data-i="${i}">Add</button>`}</div>`).join(''):'<div class="empty">No matches.</div>';
  res.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const r=rows[b.dataset.i];if(doEdit('add',l,r.key,r.item))draw()})};
 const go=async()=>{const s=inp.value.trim();if(s.length<2){res.innerHTML='<div class="empty">Type a title to search TMDB.</div>';return}
  if(!D.tm){res.innerHTML='<div class="empty">The phone does not have the TMDB key yet. Run Resync on the laptop once, then open the app again.</div>';return}
  const n=++seq;res.innerHTML='<div class="empty">Searching…</div>';
  try{const bt=D.tm.length>50,r=await fetch('https://api.themoviedb.org/3/search/multi?include_adult=false&query='+encodeURIComponent(s)+(bt?'':'&api_key='+encodeURIComponent(D.tm)),bt?{headers:{Authorization:'Bearer '+D.tm}}:{});if(n!==seq)return;if(!r.ok)throw 0;const j=await r.json();rows=(j.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').map(tmRow).sort((a,b)=>(b.kind===L0.kind)-(a.kind===L0.kind));draw()}catch(e){if(n===seq)res.innerHTML='<div class="empty">Search failed. Check the connection.</div>'}};
 inp.oninput=()=>{clearTimeout(tm);tm=setTimeout(go,350)};inp.focus()}
addEventListener('hashchange',()=>route());
route();if(cfgOK())sync().then(r=>{if(r===true&&!/settings/.test(location.hash))route(true)});addEventListener('online',()=>flush());
addEventListener('visibilitychange',()=>{if(!document.hidden)flush();if(!document.hidden&&cfgOK())sync().then(r=>{if(r===true&&!/settings|title/.test(location.hash))route(true)})});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
